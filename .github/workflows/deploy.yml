name: Deploy to Bluehost

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-dev --optimize-autoloader

      - name: Dump Composer autoload
        run: composer dump-autoload --optimize --no-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Yarn cache directory
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Use Yarn cache
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies and build
        run: |
          yarn install --prefer-offline --frozen-lockfile
          yarn build

      - name: Debug build output
        run: |
          echo "Listing assets directory:"
          ls -la assets/
          echo "Listing js/dist directory:"
          ls -la assets/js/dist/ || echo "js/dist directory not found"
          echo "Listing css/dist directory:"
          ls -la assets/css/dist/ || echo "css/dist directory not found"

      - name: FTP Deploy to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/website_77900271/wp-content/plugins/hospital-manager/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/tests/**
            **/.github/**
            **/yarn.lock
            **/package.json
            **/vite.config.mjs
            **/tailwind.config.js
            **/postcss.config.js
            **/.babelrc
            **/.phpcs.xml.dist
            **/.phpunit.result.cache
            **/phpunit.xml*
            **/composer.json
            **/composer.lock
            **/README.md
            **/LICENSE
            **/build.log
            **/dev.sh
            **/.npmrc